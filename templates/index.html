<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyurSoftApp - Ayurvedic Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=1000') center/cover; color: white; padding: 80px 20px; text-align: center; }
        .result-box { background-color: #e8f5e9; border-radius: 8px; padding: 20px; margin-top: 20px; border-left: 5px solid #2e7d32; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ayurvedic Assistant</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Discover Natural Healing with AI</h1>
        <p>Input your symptoms and receive Ayurvedic treatment suggestions powered by machine learning</p>
    </div>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="card shadow p-4">
            <h3 class="card-title text-center mb-4">Symptom & Medicine Prediction</h3>
            <div class="mb-3">
                <label for="symptomInput" class="form-label">Enter Symptoms Description:</label>
                <textarea class="form-control" id="symptomInput" rows="4" placeholder="Describe your symptoms (e.g., head pain, fever)..."></textarea>
            </div>
            <button class="btn btn-success w-100 fw-bold" onclick="predictSymptoms()">Predict</button>

            <!-- Results Output -->
            <div id="resultContainer" class="result-box d-none">
                <h4 class="text-success fw-bold">Predicted Symptom:</h4>
                <p id="predictedSymptom" class="fs-5 text-dark"></p>

                <h5 class="fw-bold mt-3">Recommended Medicines:</h5>
                <ul id="medicineList" class="list-group list-group-flush mb-3"></ul>

                <h5 class="fw-bold mt-3">Recommended Doctors:</h5>
                <ul id="doctorList" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </div>

    <script>
        async function predictSymptoms() {
            const description = document.getElementById('symptomInput').value;
            if (!description.trim()) {
                alert('Please enter a description of your symptoms.');
                return;
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: description })
                });

                const data = await response.json();
                
                document.getElementById('predictedSymptom').innerText = data.predicted_symptom;

                const medList = document.getElementById('medicineList');
                medList.innerHTML = '';
                data.recommended_medicines.forEach(med => {
                    let li = document.createElement('li');
                    li.className = 'list-group-item bg-transparent';
                    li.innerText = med;
                    medList.appendChild(li);
                });

                const docList = document.getElementById('doctorList');
                docList.innerHTML = '';
                data.recommended_doctors.forEach(doc => {
                    let li = document.createElement('li');
                    li.className = 'list-group-item bg-transparent';
                    li.innerText = `${doc.name} - Phone: ${doc.phone}`;
                    docList.appendChild(li);
                });

                document.getElementById('resultContainer').classList.remove('d-none');
            } catch (err) {
                alert('Error connecting to backend server.');
            }
        }
    </script>
</body>
</html>
